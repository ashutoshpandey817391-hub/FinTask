<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Life & AI Assistant</title>
  <!-- Colorful Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1.5rem; }
    .tab-btn.active { background: linear-gradient(90deg, #ff7e5f, #feb47b); color: white; transform: scale(1.03); }
  </style>
</head>
<body class="p-4 pb-20 text-gray-800">

  <!-- Header -->
  <header class="text-center my-4 text-white">
    <h1 class="text-3xl font-extrabold tracking-wide drop-shadow-md">✨ Smart Hub AI</h1>
    <p class="text-xs opacity-90 font-medium">Tasks • Expenses • AI Solver</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex justify-around bg-white/20 backdrop-blur-md p-1.5 rounded-2xl mb-6 shadow-inner text-sm font-bold">
    <button onclick="switchTab('tasks')" id="tab-tasks" class="tab-btn active px-4 py-2.5 rounded-xl transition-all duration-300">📋 Tasks</button>
    <button onclick="switchTab('expense')" id="tab-expense" class="tab-btn px-4 py-2.5 rounded-xl transition-all duration-300">💸 Expenses</button>
    <button onclick="switchTab('ai')" id="tab-ai" class="tab-btn px-4 py-2.5 rounded-xl transition-all duration-300">🤖 AI Help</button>
  </div>

  <!-- TAB 1: TODO & DAILY TASKS -->
  <div id="sec-tasks" class="glass-card p-5 shadow-2xl">
    <h2 class="text-xl font-bold text-indigo-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-list-check"></i> Daily Tasks & Streak</h2>
    <div class="flex gap-2 mb-4">
      <input type="text" id="taskInput" placeholder="Add new daily target..." class="w-full bg-gray-100 p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400">
      <button onclick="addTask()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-md">+</button>
    </div>
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <!-- TAB 2: SMART EXPENSE TRACKER -->
  <div id="sec-expense" class="glass-card p-5 shadow-2xl hidden">
    <h2 class="text-xl font-bold text-pink-600 mb-2 flex items-center gap-2"><i class="fa-solid fa-wallet"></i> Smart Smart Expense Logger</h2>
    <p class="text-xs text-gray-500 mb-3">Likhye simple bhasha me: <i>"Mene 20 ka biscuit aur 10 ka snack khaya"</i></p>
    
    <div class="flex flex-col gap-2 mb-4">
      <textarea id="expenseInput" rows="2" placeholder="aaj 50 rs ka momos aur 20 rs autofare..." class="w-full bg-gray-100 p-3 rounded-xl outline-none focus:ring-2 focus:ring-pink-400 text-sm"></textarea>
      <button onclick="logExpense()" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 rounded-xl font-bold shadow-md">Auto Categorize & Save</button>
    </div>

    <div class="mb-4 p-3 bg-pink-50 rounded-xl flex justify-between items-center border border-pink-100">
      <span class="font-bold text-gray-700">Total Spent:</span>
      <span id="totalSpent" class="text-2xl font-black text-pink-600">₹0</span>
    </div>

    <h3 class="font-bold text-sm text-gray-600 mb-2">Category Breakdown & History</h3>
    <div id="expenseList" class="space-y-2 text-sm"></div>
  </div>

  <!-- TAB 3: AI SOLVER -->
  <div id="sec-ai" class="glass-card p-5 shadow-2xl hidden">
    <h2 class="text-xl font-bold text-purple-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-brain"></i> AI Concept & Doubt Solver</h2>
    <input type="text" id="aiQuery" placeholder="Ask physics, maths formula, or logic..." class="w-full bg-gray-100 p-3 rounded-xl outline-none focus:ring-2 focus:ring-purple-400 mb-3">
    <button onclick="askAI()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-xl font-bold shadow-md">Get Instant Solution</button>
    
    <div id="aiResponse" class="mt-4 p-4 bg-purple-50 rounded-xl text-sm border border-purple-100 hidden">
      <p id="aiText" class="text-gray-800 leading-relaxed"></p>
    </div>
  </div>

  <!-- JavaScript Logics -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

    // Tab Switching
    function switchTab(tabName) {
      ['tasks', 'expense', 'ai'].forEach(t => {
        document.getElementById('sec-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('active');
      });
      document.getElementById('sec-' + tabName).classList.remove('hidden');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // Task Logic
    function addTask() {
      let val = document.getElementById('taskInput').value;
      if (!val) return;
      tasks.push({ text: val, done: false });
      document.getElementById('taskInput').value = '';
      saveTasks();
    }

    function toggleTask(idx) {
      tasks[idx].done = !tasks[idx].done;
      saveTasks();
    }

    function saveTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      let html = '';
      tasks.forEach((t, i) => {
        html += `<li onclick="toggleTask(${i})" class="flex justify-between items-center p-3 rounded-xl bg-gray-50 border cursor-pointer ${t.done ? 'line-through text-gray-400 bg-emerald-50' : ''}">
          <span>${t.text}</span>
          <span>${t.done ? '✅' : '⭕'}</span>
        </li>`;
      });
      document.getElementById('taskList').innerHTML = html || '<p class="text-xs text-gray-400">No tasks added yet!</p>';
    }

    // Expense Logic (Smart Categorization Rule Engine)
    function logExpense() {
      let text = document.getElementById('expenseInput').value.toLowerCase();
      if (!text) return;

      let amountMatch = text.match(/\d+/g);
      let amount = amountMatch ? amountMatch.reduce((a, b) => parseInt(a) + parseInt(b), 0) : 10;
      
      let category = "General";
      if (text.includes("biscuit") || text.includes("snack") || text.includes("momos") || text.includes("khana") || text.includes("food")) {
        category = "🍕 Food & Snacks";
      } else if (text.includes("bus") || text.includes("auto") || text.includes("petrol") || text.includes("fare")) {
        category = "🚗 Travel";
      } else if (text.includes("pen") || text.includes("book") || text.includes("copy") || text.includes("recharge")) {
        category = "📚 Study & Utility";
      }

      expenses.push({ raw: text, amount: amount, category: category, date: new Date().toLocaleDateString() });
      localStorage.setItem('my_expenses', JSON.stringify(expenses));
      document.getElementById('expenseInput').value = '';
      renderExpenses();
    }

    function renderExpenses() {
      let html = '';
      let total = 0;
      expenses.forEach((e) => {
        total += e.amount;
        html += `<div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border text-xs">
          <div><b class="text-pink-600">${e.category}</b> - <span class="text-gray-500">${e.raw}</span></div>
          <div class="font-bold">₹${e.amount}</div>
        </div>`;
      });
      document.getElementById('totalSpent').innerText = '₹' + total;
      document.getElementById('expenseList').innerHTML = html || '<p class="text-xs text-gray-400">No expenses recorded today.</p>';
    }

    // Quick AI Dummy Response Engine (Direct Integration setup)
    function askAI() {
      let q = document.getElementById('aiQuery').value;
      if(!q) return;
      document.getElementById('aiResponse').classList.remove('hidden');
      document.getElementById('aiText').innerText = "Analyzing query... 🚀 Solution: " + q + " me key formula use hoga E=mc² ya basic identity resolution. (Apex Engine Active)";
    }

    // Initial Render
    renderTasks();
    renderExpenses();
  </script>
</body>
</html>
